# TEMPORARY check — delete after verdict. Manual dispatch only (any branch).
# Installs rclone, configures onedrive remote with our token, lists one
# Teams drive and downloads one lecture file. Prints names/statuses ONLY.
name: Rclone check (temporary)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      TEAMS_REFRESH_TOKEN: ${{ secrets.TEAMS_REFRESH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUBJECTS_JSON: ${{ secrets.SUBJECTS_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install rclone
        run: |
          curl -s https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Rclone auth + download check
        run: |
          cat > /tmp/rc_check.py <<'PYEOF'
          """Temporary: mint token, configure rclone onedrive, list + fetch one file."""
          import asyncio
          import json
          import os
          import subprocess
          import sys
          from datetime import UTC, datetime, timedelta

          import httpx

          sys.path.insert(0, "src")
          from teamsleech.core.config import settings
          from teamsleech.core.constants import GRAPH_BASE_URL
          from teamsleech.services.github_secrets import rotate_github_secret


          def run(cmd: list[str]) -> subprocess.CompletedProcess[str]:
              return subprocess.run(cmd, capture_output=True, text=True, timeout=300)


          async def main() -> None:
              async with httpx.AsyncClient(timeout=30.0) as client:
                  r = await client.post(
                      "https://login.microsoftonline.com/common/oauth2/v2.0/token",
                      data={
                          "client_id": settings.teams_client_id,
                          "grant_type": "refresh_token",
                          "refresh_token": settings.teams_refresh_token,
                          "scope": "https://graph.microsoft.com/.default offline_access",
                      },
                  )
                  r.raise_for_status()
                  data = r.json()
              print("RC: token exchange OK", flush=True)
              await rotate_github_secret("TEAMS_REFRESH_TOKEN", data["refresh_token"])
              print("RC: secret rotated", flush=True)

              async with httpx.AsyncClient(timeout=30.0) as client:
                  headers = {"Authorization": f"Bearer {data['access_token']}"}
                  teams = (
                      await client.get(
                          f"{GRAPH_BASE_URL}/me/joinedTeams", headers=headers
                      )
                  ).json()["value"]
                  drive_id = ""
                  for team in teams:
                      site = (
                          await client.get(
                              f"{GRAPH_BASE_URL}/groups/{team['id']}/sites/root",
                              headers=headers,
                          )
                      ).json()
                      if not site.get("id"):
                          continue
                      drives = (
                          await client.get(
                              f"{GRAPH_BASE_URL}/sites/{site['id']}/drives",
                              headers=headers,
                          )
                      ).json().get("value", [])
                      if drives:
                          drive_id = drives[0]["id"]
                          break
              if not drive_id:
                  print("RC: no drive found via Graph")
                  return
              print("RC: drive ok", flush=True)

              expiry = (datetime.now(UTC) + timedelta(minutes=55)).isoformat()
              token = json.dumps(
                  {
                      "access_token": data["access_token"],
                      "token_type": "Bearer",
                      "refresh_token": data["refresh_token"],
                      "expiry": expiry,
                  }
              )
              conf = (
                  "[teams]\ntype = onedrive\n"
                  f"client_id = {settings.teams_client_id}\n"
                  "drive_type = documentLibrary\n"
                  f"drive_id = {drive_id}\n"
                  f"token = {token}\n"
              )
              with open("/tmp/rclone.conf", "w") as f:
                  f.write(conf)
              os.chmod("/tmp/rclone.conf", 0o600)

              ls = run(
                  ["rclone", "lsd", "teams:", "--config", "/tmp/rclone.conf",
                   "--max-depth", "1"]
              )
              print(f"RC: lsd exit={ls.returncode}", flush=True)
              print("RC: lsd out=" + ls.stdout[:500].strip(), flush=True)
              print("RC: lsd err=" + ls.stderr[-500:].strip(), flush=True)
              if ls.returncode != 0:
                  return
              # rclone-native discovery: first mp4 path as rclone sees it
              find = run(
                  ["rclone", "lsf", "teams:", "--config", "/tmp/rclone.conf",
                   "-R", "--files-only", "--include", "*.mp4"]
              )
              print(f"RC: lsf exit={find.returncode}", flush=True)
              candidates = [
                  line.strip()
                  for line in find.stdout.splitlines()
                  if line.strip().lower().endswith(".mp4")
              ][:5]
              print(f"RC: mp4 count>={len(candidates)}", flush=True)
              for cand in candidates:
                  print(f"RC: candidate={cand[:100]}", flush=True)
              if not candidates:
                  print("RC: lsf err=" + find.stderr[-500:].strip(), flush=True)
                  return
              drive_path = candidates[0]
              cp = run(
                  ["rclone", "copyto", f"teams:{drive_path}", "/tmp/rcprobe.mp4",
                   "--config", "/tmp/rclone.conf"]
              )
              print(f"RC: copyto exit={cp.returncode}", flush=True)
              print("RC: copyto err=" + cp.stderr[-500:].strip(), flush=True)
              if os.path.exists("/tmp/rcprobe.mp4"):
                  print(f"RC: bytes={os.path.getsize('/tmp/rcprobe.mp4')}", flush=True)
                  os.remove("/tmp/rcprobe.mp4")


          asyncio.run(main())
          PYEOF
          PYTHONPATH=src uv run python /tmp/rc_check.py
