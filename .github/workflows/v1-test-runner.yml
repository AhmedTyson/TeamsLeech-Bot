# v1 test runner — manual trial of the v1.0.0 pipeline on GH Actions.
# Checks out the test/v1-runner branch (v1 tree) and runs it with the live
# secrets. Temporary file: delete after the trial verdict.
# Expected: run idles until the 25-min step timeout; verdict comes from the
# download lines (200 vs 401 + URL host: files.1drv.com vs download.aspx).
name: v1 Test Runner

on:
  workflow_dispatch:

jobs:
  run:
    name: v1 pipeline trial
    runs-on: ubuntu-latest
    timeout-minutes: 32

    env:
      TEAMS_REFRESH_TOKEN: ${{ secrets.TEAMS_REFRESH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUBJECTS_JSON: ${{ secrets.SUBJECTS_JSON }}

    steps:
      - name: Checkout v1 test branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Validate secrets present
        run: |
          if [ -z "$TEAMS_REFRESH_TOKEN" ]; then
            echo "::error title=Secret Missing::TEAMS_REFRESH_TOKEN is empty or not set."
            exit 1
          fi
          echo "Secret presence check passed."

      - name: Run v1 bot (killed by timeout — verdict is in the logs)
        run: .venv/bin/python src/main.py
        timeout-minutes: 25
