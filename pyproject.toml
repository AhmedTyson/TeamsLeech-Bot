[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teamsleech"
version = "2.3.1"
description = "A high-performance, asynchronous Telegram Bot for fetching Microsoft Teams academic recordings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ahmed", email = "ahmed@example.com" }
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "Pyrogram>=2.0.0",
    "TgCrypto>=1.2.0",
    "PyNaCl>=1.5.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "python-semantic-release>=9.0.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/teamsleech", "src/worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S", "DTZ", "TRY", "EM", "ASYNC", "C901"]
# TRY003 ignored: owner-facing errors intentionally carry operational detail
# (file names, statuses) that short exception-class messages would destroy.
ignore = ["TRY003"]
flake8-quotes = { inline-quotes = "double" }

[tool.ruff.lint.per-file-ignores]
"src/teamsleech/tg_bot/handlers/*.py" = ["C901"]
# transfer.py is the only subprocess user: list-form calls with PATH
# binaries (ffmpeg/ffprobe) from the runner image.
"src/teamsleech/services/transfer.py" = ["S603", "S607"]
# Test fixtures inherently use fake credentials/paths.
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.ruff.lint.isort]
known-first-party = ["teamsleech", "worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--cov=src/teamsleech", "--cov-fail-under=85", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:There is no current event loop:DeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/teamsleech"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "src"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): v{version} [skip ci]"

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.publish]
upload_to_vcs_release = true
dist_glob_patterns = ["dist/*"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
